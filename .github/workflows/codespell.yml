---
    name: Codespell
    
    on:  # yamllint disable-line rule:truthy
      pull_request:
        branches: [main]
    
    permissions:
      contents: read
    
    jobs:
      codespell:
        name: Check for spelling errors
        runs-on: ubuntu-latest
    
        steps:
          - name: Checkout
            uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.3.1
          - name: Codespell
            uses: codespell-project/actions-codespell@8f01853be192eb0f849a5c7d721450e7a467c579 # v2.2